<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#111827"/><link rel="manifest" href="manifest.json"/><title>DeAr FollowUp CRM</title><style>body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827}button,input,select,textarea{font:inherit}*{box-sizing:border-box}.app{max-width:1200px;margin:auto}.top{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:800}.sub{opacity:.7;font-size:12px}.nav{display:flex;gap:8px;overflow:auto;padding:10px 0}.nav button{border:0;border-radius:10px;padding:10px 14px;background:#fff;color:#374151}.nav button.active{background:#111827;color:#fff}.content{padding:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0000000b}.num{font-size:28px;font-weight:800}.muted{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:700;color:#374151}input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;background:#fff}textarea{min-height:80px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#111827;color:#fff;font-weight:700}.btn.secondary{background:#e5e7eb;color:#111827}.btn.green{background:#059669}.btn.blue{background:#2563eb}.btn.red{background:#dc2626}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.lead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.lead h3{margin:0 0 5px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:700}.list{display:grid;gap:10px}.empty{text-align:center;padding:40px;color:#6b7280}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.content{padding:10px}.top{padding:14px 12px}}
</style></head><body><div id="root"></div><script type="module" src="app.js"></script></body></html>
