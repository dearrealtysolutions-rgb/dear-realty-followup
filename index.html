<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeAr Team Follow-Up</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7fb;color:#111827}header{background:#111827;color:white;padding:15px;position:sticky;top:0;z-index:4}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.small{font-size:12px;color:#94a3b8}nav{display:flex;gap:6px;overflow:auto;margin-top:12px}nav button,.btn{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;background:#263244;color:white;font-weight:600}nav .active,.blue{background:#2563eb}.green{background:#059669}.red{background:#dc2626}.light{background:#eef2f7;color:#111827}main{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card,.loginbox{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:15px}.stat b{display:block;font-size:25px}.muted{color:#64748b;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:180px}label{display:block;font-size:12px;color:#64748b;margin:6px 0}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}textarea{min-height:75px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}.badge{background:#eef2ff;color:#3730a3;padding:4px 7px;border-radius:99px;font-size:11px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:white;width:min(720px,96%);max-height:92vh;overflow:auto;border-radius:16px;padding:18px}.toast{position:fixed;right:15px;bottom:15px;background:#111827;color:white;padding:13px 15px;border-radius:10px;display:none;z-index:20}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%)}.empty{text-align:center;padding:25px;color:#64748b}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div id="box" class="box"></div></div><script>
let token=localStorage.dearToken||"",me=JSON.parse(localStorage.dearMe||"null"),page="dashboard",leads=[],props=[],users=[],editId=null;
const statuses=["New Lead","Contacted","Interested","Site Visit Planned","Site Visit Done","Negotiation","Booking","Booked","Not Interested","Follow Up Later","Closed"],pstatuses=["Available","Booking Ongoing","Customer Visit Done","Sold"];
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(p,o={}){o.headers=Object.assign({"Content-Type":"application/json","Authorization":"Bearer "+token},o.headers||{});let r=await fetch("/api"+p,o),x=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error("Login required")}if(!r.ok)throw Error(x.error||"Request failed");return x}
function loginView(){root.innerHTML=`<div class="login"><div class="loginbox"><h2>DeAr Client Follow-Up</h2><p class="muted">Shared Team App</p><label>Username</label><input id="un"><label>Password</label><input id="pw" type="password"><div class="actions"><button class="btn blue" onclick="login()">Login</button></div></div></div>`}
async function login(){try{let x=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:un.value,password:pw.value})}).then(r=>r.json());if(!x.token)throw Error(x.error);token=x.token;me=x.user;localStorage.dearToken=token;localStorage.dearMe=JSON.stringify(me);start()}catch(e){alert(e.message)}}
function logout(){localStorage.clear();location.reload()}
async function start(){await refresh();render();let s=io();s.on("connect",()=>s.emit("join",me.id));s.on("data_changed",async()=>{await refresh();render()});s.on("notification",n=>{toast(n.message);if("Notification"in window&&Notification.permission==="granted")new Notification("DeAr Client Assigned",{body:n.message})})}
async function refresh(){[leads,props,users]=await Promise.all([api("/leads"),api("/properties"),api("/users")])}
function nav(){return `<nav>${[["dashboard","Dashboard"],["leads","Clients"],["properties","Projects"],["team","Team"]].map(a=>`<button class="${page==a[0]?"active":""}" onclick="page='${a[0]}';render()">${a[1]}</button>`).join("")}<button onclick="enableNotify()">🔔 Notifications</button><button onclick="logout()">Logout</button></nav>`}
function shell(c){root.innerHTML=`<header><div class="top"><div><div class="brand">DeAr Client Follow-Up</div><div class="small">${esc(me.name)} • ${esc(me.role)}</div></div></div>${nav()}</header><main>${c}</main>`}
function render(){if(!me)return loginView();if(page=="dashboard")dashboard();if(page=="leads")leadPage();if(page=="properties")propPage();if(page=="team")teamPage()}
function dashboard(){let d=new Date().toISOString().slice(0,10),active=leads.filter(x=>!["Booked","Closed","Not Interested"].includes(x.status)).length,due=leads.filter(x=>x.next_followup==d).length,over=leads.filter(x=>x.next_followup&&x.next_followup<d&&!["Booked","Closed","Not Interested"].includes(x.status)).length;shell(`<div class="grid"><div class="stat"><span class="muted">Total Clients</span><b>${leads.length}</b></div><div class="stat"><span class="muted">Active</span><b>${active}</b></div><div class="stat"><span class="muted">Today Follow-up</span><b>${due}</b></div><div class="stat"><span class="muted">Overdue</span><b>${over}</b></div></div><div class="card" style="margin-top:14px"><div class="row"><div class="field"><input id="search" placeholder="Search client / phone / location..." oninput="dashSearch()"></div><button class="btn blue" onclick="openLead()">+ Add Client</button><button class="btn green" onclick="openProp()">+ Add Project</button></div><div id="dashTable"></div></div><div class="card" style="margin-top:14px"><b>Today's Follow-ups</b>${rows(leads.filter(x=>x.next_followup==d))}</div></div>`);dashSearch()}
function dashSearch(){let q=($("search")?.value||"").toLowerCase();$("dashTable").innerHTML=rows(leads.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,30))}
function rows(a){if(!a.length)return `<div class="empty">No clients found.</div>`;return `<table><tr><th>Client</th><th>Phone</th><th>Requirement</th><th>Assigned</th><th>Follow-up</th><th>Status</th><th></th></tr>${a.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.location)}</span></td><td>${esc(x.phone)}</td><td>${esc(x.requirement)}<br>${esc(x.budget)}</td><td>${esc(x.assigned_name||"—")}</td><td>${esc(x.next_followup||"—")}</td><td><span class="badge">${esc(x.status)}</span></td><td><button class="btn light" onclick="openLead(${x.id})">Open</button></td></tr>`).join("")}</table>`}
function leadPage(){shell(`<div class="card"><div class="row"><div class="field"><input id="lq" placeholder="Search clients..." oninput="filterLeads()"></div><div class="field"><select id="ls" onchange="filterLeads()"><option value="">All Status</option>${statuses.map(x=>`<option>${x}</option>`).join("")}</select></div><button class="btn blue" onclick="openLead()">+ Add Client</button></div><div id="lt"></div></div>`);filterLeads()}
function filterLeads(){let q=($("lq")?.value||"").toLowerCase(),s=$("ls")?.value||"";$("lt").innerHTML=rows(leads.filter(x=>(!s||x.status==s)&&JSON.stringify(x).toLowerCase().includes(q)))}
function propPage(){shell(`<div class="card"><div class="row"><div class="field"><input id="pq" placeholder="Search projects..." oninput="filterProps()"></div><button class="btn blue" onclick="openProp()">+ Add Project</button></div><div id="pt"></div></div>`);filterProps()}
function filterProps(){let q=($("pq")?.value||"").toLowerCase(),a=props.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$("pt").innerHTML=a.length?`<table><tr><th>Project</th><th>Location</th><th>Price</th><th>Status</th><th></th></tr>${a.map(x=>`<tr><td><b>${esc(x.title)}</b><br><span class="muted">${esc(x.details)}</span></td><td>${esc(x.location)}</td><td>${esc(x.price)}</td><td>${esc(x.status)}</td><td><button class="btn light" onclick="openProp(${x.id})">Edit</button></td></tr>`).join("")}</table>`:`<div class="empty">No projects.</div>`}
function teamPage(){shell(`<div class="card"><h3>Team</h3><p class="muted">All members using the same app URL see the same client and project database. When you assign a client, the assigned member receives a real-time notification.</p>${me.role=="admin"?`<div class="row"><div class="field"><input id="tn" placeholder="Name"></div><div class="field"><input id="tu" placeholder="Username"></div><div class="field"><input id="tp" placeholder="Password"></div><button class="btn blue" onclick="addUser()">Create Member</button></div>`:""}<table><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${me.role=="admin"&&u.id!=me.id?`<button class="btn red" onclick="delUser(${u.id})">Remove</button>`:""}</td></tr>`).join("")}</table></div>`)}
function inp(label,id,v,type="text"){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(v||"")}"></div>`}
function openLead(id){let x=leads.find(v=>v.id==id)||{name:"",phone:"",email:"",location:"",requirement:"",budget:"",property_type:"Flat",status:"New Lead",next_followup:new Date().toISOString().slice(0,10),assigned_to:me.id,source:"Facebook",notes:""};editId=id;$("box").innerHTML=`<h3>${id?"Edit Client":"Add Client"}</h3><div class="row">${inp("Client Name *","n",x.name)}${inp("Phone / WhatsApp *","ph",x.phone)}${inp("Email","em",x.email)}${inp("Preferred Location","loc",x.location)}${inp("Requirement","req",x.requirement)}${inp("Budget","bud",x.budget)}<div class="field"><label>Property Type</label><select id="typ">${["Flat","Bungalow","Plot","Commercial","Other"].map(v=>`<option ${x.property_type==v?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><label>Status</label><select id="st">${statuses.map(v=>`<option ${x.status==v?"selected":""}>${v}</option>`).join("")}</select></div>${inp("Next Follow-up","next",x.next_followup,"date")}<div class="field"><label>Assign To</label><select id="ass">${users.map(u=>`<option value="${u.id}" ${+x.assigned_to==u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div><div class="field"><label>Lead Source</label><select id="src">${["Facebook","Instagram","YouTube","WhatsApp","Referral","Website","Other"].map(v=>`<option ${x.source==v?"selected":""}>${v}</option>`).join("")}</select></div><div class="field" style="min-width:100%"><label>Notes</label><textarea id="notes">${esc(x.notes)}</textarea></div></div><div class="actions"><button class="btn blue" onclick="saveLead()">Save Client</button><button class="btn light" onclick="closeM()">Cancel</button>${id?`<button class="btn red" onclick="delLead(${id})">Delete</button>`:""}${x.phone?`<a class="btn green" href="tel:${esc(x.phone)}">Call</a><a class="btn green" target="_blank" href="https://wa.me/91${String(x.phone).replace(/\\D/g,"")}">WhatsApp</a>`:""}</div>${id?`<div class="card" style="margin-top:12px"><b>Follow-up History</b><div id="hist"></div><div class="actions"><input id="newnote" placeholder="Follow-up note"><button class="btn" onclick="addNote(${id})">Add Note</button></div></div>`:""}`;$("modal").classList.add("show");if(id)loadNotes(id)}
async function saveLead(){let x={name:$("n").value,phone:$("ph").value,email:$("em").value,location:$("loc").value,requirement:$("req").value,budget:$("bud").value,property_type:$("typ").value,status:$("st").value,next_followup:$("next").value,assigned_to:+$("ass").value,source:$("src").value,notes:$("notes").value};if(!x.name||!x.phone)return alert("Name and phone are required");await api(editId?"/leads/"+editId:"/leads",{method:editId?"PUT":"POST",body:JSON.stringify(x)});closeM();await refresh();render()}
async function loadNotes(id){let a=await api("/leads/"+id+"/notes");$("hist").innerHTML=a.length?a.map(n=>`<p><span class="muted">${esc(n.created_at)} • ${esc(n.user_name)}</span><br>${esc(n.note)}</p>`).join(""):"<p class='muted'>No notes.</p>"}
async function addNote(id){let v=$("newnote").value.trim();if(!v)return;await api("/leads/"+id+"/notes",{method:"POST",body:JSON.stringify({note:v})});$("newnote").value="";loadNotes(id)}
async function delLead(id){if(confirm("Delete client?")){await api("/leads/"+id,{method:"DELETE"});closeM();await refresh();render()}}
function openProp(id){let x=props.find(v=>v.id==id)||{title:"",location:"",price:"",details:"",status:"Available"};editId=id;$("box").innerHTML=`<h3>${id?"Edit Project":"Add Project"}</h3><div class="row">${inp("Project / Property Name","ptitle",x.title)}${inp("Location","ploc",x.location)}${inp("Price","pprice",x.price)}<div class="field"><label>Status</label><select id="pstatus">${pstatuses.map(v=>`<option ${x.status==v?"selected":""}>${v}</option>`).join("")}</select></div><div class="field" style="min-width:100%"><label>Details</label><textarea id="pdetails">${esc(x.details)}</textarea></div></div><div class="actions"><button class="btn blue" onclick="saveProp()">Save</button><button class="btn light" onclick="closeM()">Cancel</button>${id?`<button class="btn red" onclick="delProp(${id})">Delete</button>`:""}</div>`;$("modal").classList.add("show")}
async function saveProp(){let x={title:$("ptitle").value,location:$("ploc").value,price:$("pprice").value,details:$("pdetails").value,status:$("pstatus").value};if(!x.title)return alert("Title required");await api(editId?"/properties/"+editId:"/properties",{method:editId?"PUT":"POST",body:JSON.stringify(x)});closeM();await refresh();render()}
async function delProp(id){if(confirm("Delete project?")){await api("/properties/"+id,{method:"DELETE"});closeM();await refresh();render()}}
async function addUser(){try{await api("/users",{method:"POST",body:JSON.stringify({x:$("tn").value,username:$("tu").value,password:$("tp").value})});await refresh();render()}catch(e){alert(e.message)}}
async function delUser(id){if(confirm("Remove member?")){await api("/users/"+id,{method:"DELETE"});await refresh();render()}}
async function loadNotifs(){let n=await api("/notifications");if(n[0])toast(n[0].message);await api("/notifications/read",{method:"POST"})}
async function enableNotify(){if("Notification"in window){let p=await Notification.requestPermission();if(p=="granted")toast("Notifications enabled")}await loadNotifs()}
function closeM(){$("modal").classList.remove("show");editId=null}function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",5000)}
$("modal").onclick=e=>{if(e.target.id=="modal")closeM()};if(token&&me)start();else loginView();
</script></body></html>
